name: Update ShotLink Data

on:
  schedule:
    # Mondays 14:00 UTC, after Sunday finishes
    - cron: '0 14 * * 1'
  workflow_dispatch:
    inputs:
      year:
        description: 'Season to update (defaults to the current year)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  update-shotlink:
    runs-on: ubuntu-latest
    timeout-minutes: 300

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            local::.
            any::piggyback
            any::arrow
            any::tidyr
            any::jsonlite

      - name: Create release tags if needed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for tag in shots tee_times course_setup ids skill_ratings; do
            if ! gh release view "$tag" --repo ${{ github.repository }} > /dev/null 2>&1; then
              gh release create "$tag" --repo ${{ github.repository }} \
                --title "$tag" --notes "Auto-updated golfastr data." --latest=false
            fi
          done

      - name: Fetch new ShotLink events
        run: |
          YEAR="${{ inputs.year }}"
          [ -z "$YEAR" ] && YEAR=$(date +%Y)
          Rscript data-raw/update_shotlink.R "$YEAR" --incremental --upload

      - name: Rebuild the ID crosswalk
        run: Rscript data-raw/build_ids.R --upload

      - name: Recompute this week's win probability with the true hole order
        run: |
          YEAR="${{ inputs.year }}"
          [ -z "$YEAR" ] && YEAR=$(date +%Y)
          Rscript data-raw/update_win_probability.R "$YEAR" --since-days 10 --upload
